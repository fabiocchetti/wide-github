<!-- PageLayout width variants. Only large and xlarge are widened: the narrow
     ones (settings forms and similar) must keep their intended width.
     The class suffix is a build hash, so it must not be matched literally. -->
<div class="prc-PageLayout-Content-xWL-A" data-width="large"  data-expect="wide"></div>
<div class="prc-PageLayout-Content-xWL-A" data-width="xlarge" data-expect="wide"></div>
<div class="prc-PageLayout-Content-ZZZZZ" data-width="xlarge" data-expect="wide"></div>
<div class="prc-PageLayout-Content-xWL-A" data-width="medium" data-expect="narrow"></div>
<div class="prc-PageLayout-Content-xWL-A" data-width="small"  data-expect="narrow"></div>
<div class="SidebarPageLayout-module__HeaderInner__bPVX7" data-width="medium" data-expect="narrow"></div>
